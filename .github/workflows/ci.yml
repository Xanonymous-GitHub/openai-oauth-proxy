name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      REQUIRE_EXTERNAL_AGENTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: ""
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pinned external agent clients
        env:
          HERMES_COMMIT: 5fc308a70719a83cccdbba4c0e39c23f5a8239d5
          HERMES_INSTALLER_SHA256: c0380bc1f78d3d662a77663ce20cc17e14cbc4bec35e61ab7a33bac5f3afed2d
        run: |
          bun i -g opencode-ai@1.18.23
          HERMES_INSTALLER="$RUNNER_TEMP/hermes-install.sh"
          curl -fsSL \
            "https://raw.githubusercontent.com/NousResearch/hermes-agent/$HERMES_COMMIT/scripts/install.sh" \
            --output "$HERMES_INSTALLER"
          printf '%s  %s\n' "$HERMES_INSTALLER_SHA256" "$HERMES_INSTALLER" | sha256sum --check
          bash "$HERMES_INSTALLER" \
            --branch v2026.8.27 \
            --commit "$HERMES_COMMIT" \
            --force-commit \
            --skip-setup \
            --skip-browser \
            --skip-computer-use \
            --no-skills \
            --non-interactive \
            --hermes-home "$RUNNER_TEMP/hermes-home" \
            --dir "$RUNNER_TEMP/hermes-agent"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -c 'import sys; assert sys.version_info[:3] == (3, 14, 7), sys.version'
          test "$(opencode --version)" = "1.18.23"
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "$HERMES_COMMIT"
          "$RUNNER_TEMP/hermes-agent/venv/bin/python" -c 'import sys; from hermes_cli import __release_date__, __version__; assert (__version__, __release_date__, sys.version_info[:2]) == ("0.20.6", "2026.8.27", (3, 11))'
      - run: bun install --frozen-lockfile
      - run: bun run protocol:check
      - run: bun run deps:check
      - run: bun run check
      - name: Kubernetes manifest render
        run: |
          kubectl kustomize deploy/base >/tmp/rendered.yaml
          test -s /tmp/rendered.yaml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build multiarch OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/openai-oauth-proxy.oci
          provenance: true
