name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      REQUIRE_EXTERNAL_AGENTS: "1"
      HERMES_HOME: ${{ runner.temp }}/hermes-home
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: ""
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pinned external agent clients
        env:
          HERMES_COMMIT: e06df9c2eae6901f4c88f464e0ae6e753c0428b8
          HERMES_INSTALLER_SHA256: f4cdb0e20f1aca2c3871a76b962fd4db61510f549cf973759c753ac13349beb5
        run: |
          bun i -g --trust @opencode/cli@2.0.29
          HERMES_INSTALLER="$RUNNER_TEMP/hermes-install.sh"
          curl -fsSL \
            "https://raw.githubusercontent.com/NousResearch/hermes-agent/$HERMES_COMMIT/scripts/install.sh" \
            --output "$HERMES_INSTALLER"
          printf '%s  %s\n' "$HERMES_INSTALLER_SHA256" "$HERMES_INSTALLER" | sha256sum --check
          bash "$HERMES_INSTALLER" \
            --branch main \
            --commit "$HERMES_COMMIT" \
            --skip-setup \
            --skip-browser \
            --skip-computer-use \
            --non-interactive \
            --hermes-home "$HERMES_HOME" \
            --dir "$HERMES_HOME/hermes-agent"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -c 'import sys; assert sys.version_info[:3] == (3, 15, 0), sys.version'
          test "$(opencode --version)" = "opencode v2.0.29"
          test "$(git -C "$HERMES_HOME/hermes-agent" rev-parse HEAD)" = "$HERMES_COMMIT"
          HERMES_VERSION="$("$HOME/.local/bin/hermes" --version)"
          printf '%s\n' "$HERMES_VERSION" | grep -E '^Hermes Agent v0\.22\.0( |$)'
          printf '%s\n' "$HERMES_VERSION" | grep -Fx 'Python: 3.14.7'
      - run: bun install --frozen-lockfile
      - run: bun run protocol:check
      - run: bun run deps:check
      - run: bun run check
      - name: Kubernetes manifest render
        run: |
          kubectl kustomize deploy/base >/tmp/rendered.yaml
          test -s /tmp/rendered.yaml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build multiarch OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/openai-oauth-proxy.oci
          provenance: true
